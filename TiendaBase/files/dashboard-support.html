<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Soporte</title>
    <link rel="stylesheet" href="./css/dashboard-support.css"> <!-- Enlace a la hoja de estilos -->
</head>
<body>

    <!-- Barra lateral -->
    <div class="sidebar">
        <div class="user-profile">
            <img src="/img/user-avatar.png" alt="Avatar">
            <h3>Bienvenido, <span id="userName"></span></h3>
        </div>
        <nav>
            <ul>
                <li><a href="/dashboard/support" class="active">Panel de Soporte</a></li>
                <li><a href="/" onclick="fetch('/logout').then(() => true); return true;">Cerrar Sesión</a></li>

            </ul>
        </nav>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <h1>Panel de Soporte</h1>
        <div class="content-section">
            <h2>Tickets Pendientes</h2>
            <table id="ticketsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Asunto</th>
                        <th>Cliente</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se mostrarán los tickets de soporte -->
                </tbody>
            </table>
        </div>

        <!-- Formulario para agregar un nuevo ticket -->
        <div class="content-section">
            <h2>Agregar Nuevo Ticket</h2>
            <form id="ticketForm">
                <div class="form-group">
                    <label for="subject">Asunto</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="customer">Cliente</label>
                    <input type="text" id="customer" name="customer" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Crear Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/public/js/dashboard-support.js"></script> 
</body>
</html>
