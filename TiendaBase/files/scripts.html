<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts - Underworld</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Estilos para la lista de scripts */
        .scripts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        
        .script-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .script-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        
        .script-image {
            height: 180px;
            overflow: hidden;
        }
        
        .script-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        
        .script-card:hover .script-image img {
            transform: scale(1.05);
        }
        
        .script-content {
            padding: 15px;
        }
        
        .script-title {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 18px;
        }
        
        .script-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .script-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .script-price {
            font-weight: bold;
            color: #e63946;
        }
        
        .script-category {
            background-color: #f8f9fa;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }
        
        .script-actions {
            text-align: center;
        }
        
        .ver-detalle-btn {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .ver-detalle-btn:hover {
            background-color: #3a5783;
        }
        
        .loading-indicator {
            text-align: center;
            padding: 40px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 4px;
            margin: 20px;
            text-align: center;
        }
        
        .page-header {
            background-color: #f8f9fa;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .page-title {
            margin: 0;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">
                <a href="/">Underworld</a>
            </div>
            <ul class="nav-links">
                <li><a href="/">Inicio</a></li>
                <li><a href="/scripts.html" class="active">Scripts</a></li>
                <li><a href="/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Nuestros Scripts</h1>
        </div>
        
        <div id="loading-indicator" class="loading-indicator">
            <div class="loading-spinner"></div>
            <p>Cargando scripts...</p>
        </div>
        
        <div id="scripts-container" class="scripts-container">
            <!-- Aquí se cargarán dinámicamente los scripts -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Underworld - Todos los derechos reservados</p>
    </footer>

    <script src="/js/scripts.js"></script>
</body>
</html>
